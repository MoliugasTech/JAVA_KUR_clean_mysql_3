spring.application.name=food-delivery-api
server.port=8080

# Reuses the same ignored db.properties file as JavaFX and StartNoGui.
spring.config.import=optional:file:./db.properties
spring.datasource.url=${db.url}
spring.datasource.username=${db.user}
spring.datasource.password=${db.password:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is managed by checked-in SQL migrations. REST startup validates it
# but must not silently add or remove coursework tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.error.include-message=always
